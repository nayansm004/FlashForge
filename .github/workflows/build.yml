name: Build & Release

# Runs on every push of a version tag (e.g. v1.0.0) and builds a native
# desktop binary for Windows, macOS, and Linux, then attaches all three
# to a GitHub Release. This is the download-anywhere mechanism for the
# site — there is no separate Electron wrapper; PyInstaller freezes the
# PyQt6 app itself into a native executable per OS.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: FlashForge-windows
          - os: macos-latest
            artifact_name: FlashForge-macos
          - os: ubuntu-latest
            artifact_name: FlashForge-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller flashforge.spec

      - name: Zip build (Windows/Linux)
        if: matrix.os != 'macos-latest'
        shell: bash
        run: cd dist && zip -r ../${{ matrix.artifact_name }}.zip FlashForge

      - name: Zip build (macOS)
        if: matrix.os == 'macos-latest'
        run: cd dist && zip -r ../${{ matrix.artifact_name }}.zip FlashForge

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release with binaries attached
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
