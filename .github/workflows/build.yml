name: Build & Release

# Runs on every push of a version tag (e.g. v1.0.0) and builds a native,
# click-to-install desktop package for Windows, macOS, and Linux, then
# attaches all of them to a GitHub Release.
#
# Output artifacts:
#   - FlashForge-Setup.exe            (Windows installer, Inno Setup)
#   - FlashForge.dmg                  (macOS disk image, drag-to-Applications)
#   - FlashForge-<version>-linux-amd64.deb   (Debian/Ubuntu installer)
#   - FlashForge-linux-portable.tar.gz       (fallback for non-Debian distros)
#
# To ship a release: update VERSION in main.py, commit, then:
#   git tag v1.0.0 && git push origin v1.0.0
# This workflow builds everything and publishes it to the repo's
# "Releases" page automatically — that page IS your download site.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ---------- macOS: build .icns from the source PNG ----------
      - name: Generate .icns (macOS)
        if: matrix.platform == 'macos'
        run: |
          mkdir -p assets/icon.iconset
          sips -z 16 16     assets/icon_1024.png --out assets/icon.iconset/icon_16x16.png
          sips -z 32 32     assets/icon_1024.png --out assets/icon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/icon_1024.png --out assets/icon.iconset/icon_32x32.png
          sips -z 64 64     assets/icon_1024.png --out assets/icon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/icon_1024.png --out assets/icon.iconset/icon_128x128.png
          sips -z 256 256   assets/icon_1024.png --out assets/icon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/icon_1024.png --out assets/icon.iconset/icon_256x256.png
          sips -z 512 512   assets/icon_1024.png --out assets/icon.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/icon_1024.png --out assets/icon.iconset/icon_512x512.png
          cp assets/icon_1024.png assets/icon.iconset/icon_512x512@2x.png
          iconutil -c icns assets/icon.iconset -o assets/icon.icns

      - name: Build with PyInstaller
        run: pyinstaller flashforge.spec

      # ---------- Windows: compile Inno Setup installer ----------
      - name: Install Inno Setup (Windows)
        if: matrix.platform == 'windows'
        run: choco install innosetup -y

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows.iss'

      - name: Upload Windows installer
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: FlashForge-windows-installer
          path: dist_installer/FlashForge-Setup.exe

      # ---------- macOS: pack .app into a .dmg ----------
      - name: Build .dmg (macOS)
        if: matrix.platform == 'macos'
        run: |
          mkdir -p dist_installer dmg_staging
          cp -r "dist/FlashForge.app" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "FlashForge" -srcfolder dmg_staging -ov -format UDZO dist_installer/FlashForge.dmg

      - name: Upload macOS installer
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: FlashForge-macos-installer
          path: dist_installer/FlashForge.dmg

      # ---------- Linux: build .deb + a portable tarball fallback ----------
      - name: Build .deb (Linux)
        if: matrix.platform == 'linux'
        run: |
          chmod +x installer/build_deb.sh
          bash installer/build_deb.sh 1.0.0

      - name: Build portable tarball (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist_installer
          tar -czf dist_installer/FlashForge-linux-portable.tar.gz -C dist FlashForge

      - name: Upload Linux installers
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: FlashForge-linux-installers
          path: |
            dist_installer/*.deb
            dist_installer/FlashForge-linux-portable.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release with installers attached
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/FlashForge-windows-installer/FlashForge-Setup.exe
            artifacts/FlashForge-macos-installer/FlashForge.dmg
            artifacts/FlashForge-linux-installers/*.deb
            artifacts/FlashForge-linux-installers/FlashForge-linux-portable.tar.gz
          generate_release_notes: true
